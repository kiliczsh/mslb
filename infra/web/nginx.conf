worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 11m;
    client_body_buffer_size 16k;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_buffer_size 8k;
    proxy_buffers 4 8k;
    proxy_busy_buffers_size 16k;
    keepalive_timeout 15;
    send_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 30s;
    resolver 127.0.0.11 valid=5s ipv6=off;
    map $http_host $known_host {
        default 0;
        localhost 1;
        localhost:8080 1;
        127.0.0.1 1;
        127.0.0.1:8080 1;
        web 1;
        web:8080 1;
    }
    # ReDoc supplies its own document policy; other pages retain the dashboard policy.
    map $uri $content_security_policy {
        default "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
        ~^/api/docs(?:/|$) "";
    }
    server {
        listen 8080;
        server_name localhost 127.0.0.1 web;
        root /usr/share/nginx/html;
        if ($known_host = 0) { return 421; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $content_security_policy always;
        location /api/ {
            set $api http://api:8000;
            proxy_pass $api$request_uri;
            proxy_set_header Host api:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 45s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
        location = /health { return 200 'healthy'; }
        location = /download-worker.js { expires -1; }
        location /_download/ { return 404; }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
