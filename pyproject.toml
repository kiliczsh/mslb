[project]
name = "mslb-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["mslb-contracts", "mslb-engine"]

[tool.uv.sources]
mslb-contracts = { workspace = true }
mslb-engine = { workspace = true }

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/contracts", "packages/engine"]

[dependency-groups]
dev = ["ruff", "ty", "pytest", "asyncpg", "redis"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p no:cacheprovider"
filterwarnings = ["error"]
