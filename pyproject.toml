[project]
name = "mslb-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["mslb-contracts", "mslb-engine", "mslb-application", "mslb-persistence", "mslb-worker", "mslb-api", "mslb-mock-server", "mslb-controller"]

[tool.uv.sources]
mslb-contracts = { workspace = true }
mslb-engine = { workspace = true }
mslb-application = { workspace = true }
mslb-persistence = { workspace = true }
mslb-worker = { workspace = true }
mslb-api = { workspace = true }
mslb-mock-server = { workspace = true }
mslb-controller = { workspace = true }

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/contracts", "packages/engine", "packages/application", "packages/persistence", "apps/worker", "apps/api", "apps/mock-server", "apps/container-controller"]

[dependency-groups]
dev = ["ruff", "ty", "pytest", "asyncpg", "redis", "httpx==0.28.1", "jsonschema==4.26.0"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["scripts/validate_run.py", "docs/assignment/test-data"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "ASYNC", "S", "ANN",
  "A001", "A002", "A003", "A004", "A005", "A006", "C4",
  "N801", "N802", "N803", "N804", "N805", "N806",
  "SIM", "PIE", "RSE", "RET", "DTZ", "LOG", "G", "FAST", "RUF005", "RUF021",
  "D2", "D3", "D4",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.rules]
all = "error"

[tool.ty.src]
exclude = ["scripts/validate_run.py", "docs/assignment/test-data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["integration"]
pythonpath = ["."]
addopts = "-ra -p no:cacheprovider"
filterwarnings = ["error"]
