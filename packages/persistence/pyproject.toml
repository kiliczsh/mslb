[project]
name = "mslb-persistence"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["mslb-contracts", "sqlalchemy[asyncio]==2.1.8", "alembic==1.20.1", "asyncpg"]

[tool.uv.sources]
mslb-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mslb_persistence"]
