[project]
name = "mslb-application"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["mslb-contracts", "mslb-engine", "mslb-persistence", "ijson==3.6.0"]

[tool.uv.sources]
mslb-contracts = { workspace = true }
mslb-engine = { workspace = true }
mslb-persistence = { workspace = true }

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mslb_application"]

# Source navigation is not a runtime wheel asset; Python/Alembic assets remain included.
exclude = ["**/README.md"]
