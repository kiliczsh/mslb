# Operational traffic components. The root Compose file includes these by default.
x-backend: &backend
  image: mslb-python-runtime:local
  build:
    context: .
    dockerfile: infra/tooling/python.Dockerfile
    target: runtime
  command: [python, -m, mslb_mock_server]
  read_only: true
  tmpfs: ["/run/mslb-tmp:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 128m
  memswap_limit: 128m
  cpus: 0.5
  pids_limit: 32
  networks: [docker-traffic]
  stop_grace_period: 5s
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).close()"]
    interval: 5s
    timeout: 3s
    retries: 15
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"
      mode: non-blocking
      max-buffer-size: 1m
  labels:
    com.mslb.component: http-backend
    com.mslb.backend-kind: static

services:
  container-controller:
    image: mslb-python-runtime:local
    command: [python, -m, mslb_controller.controller_main]
    user: "1000:1000"
    read_only: true
    tmpfs: ["/run/mslb-tmp:rw,noexec,nosuid,nodev,size=8m,uid=1000,gid=1000,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.5
    pids_limit: 48
    environment:
      DATABASE_URL: postgresql://mslb:local-demo-only@postgres/mslb
      RESOURCE_GUARD_ENABLED: "true"
    volumes: ["controller-auth:/run/controller-auth:ro", "inputs:/data/inputs:ro", "outputs:/data/outputs"]
    networks: [docker-control, control-data, docker-traffic]
    depends_on:
      docker-proxy: {condition: service_healthy}
    stop_grace_period: 55s
    restart: on-failure:3
    healthcheck:
      test: [CMD, python, -m, mslb_controller.controller_health]
      interval: 5s
      timeout: 3s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
        mode: non-blocking
        max-buffer-size: 1m
  resource-guard:
    image: mslb-python-runtime:local
    command: [python, -m, mslb_controller.guard_main]
    user: "1000:1000"
    read_only: true
    tmpfs: ["/run/mslb-tmp:rw,noexec,nosuid,nodev,size=4m,uid=1000,gid=1000,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 32
    environment:
      DATABASE_URL: postgresql://mslb:local-demo-only@postgres/mslb
    volumes: ["guard-auth:/run/guard-auth:ro", "host-memory:/run/host-memory:ro"]
    networks: [docker-control, control-data]
    depends_on:
      docker-proxy: {condition: service_healthy}
    stop_grace_period: 30s
    restart: on-failure:3
    healthcheck:
      test: [CMD, python, -m, mslb_controller.guard_health]
      interval: 5s
      timeout: 3s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
        mode: non-blocking
        max-buffer-size: 1m
  host-memory-writer:
    profiles: [tools]
    image: mslb-python-runtime:local
    command: [python, -m, mslb_controller.host_memory]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 16
    network_mode: none
    stdin_open: true
    volumes: ["host-memory:/run/host-memory"]
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
  control-init:
    image: mslb-python-runtime:local
    command: [python, -m, mslb_controller.credentials, --all]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 16
    network_mode: none
    volumes: [controller-auth:/run/controller-auth, guard-auth:/run/guard-auth]
  docker-proxy:
    image: mslb-python-runtime:local
    command: [python, -m, mslb_controller.proxy_main]
    # Socket ownership requires UID 0. No Linux capabilities; GID 1000 reads only its credential.
    user: "0:1000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 160m
    memswap_limit: 160m
    cpus: 0.5
    pids_limit: 32
    environment:
      RESOURCE_GUARD_ENABLED: "true"
      DATABASE_URL: postgresql://mslb:local-demo-only@postgres/mslb
      PROXY_BIND_HOST: 0.0.0.0
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro", "controller-auth:/run/controller-auth:ro", "guard-auth:/run/guard-auth:ro"]
    networks: [docker-control, control-data, docker-traffic]
    depends_on:
      control-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      backend-a: {condition: service_healthy}
      backend-b: {condition: service_healthy}
    stop_grace_period: 55s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
        mode: non-blocking
        max-buffer-size: 1m
  docker-proxy-check:
    profiles: [tools]
    image: mslb-python-tools:local
    command: [python, -m, scripts.check_lifecycle]
    user: "0:1000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    pids_limit: 48
    environment:
      TEST_DATABASE_URL: postgresql://mslb:local-demo-only@postgres/mslb
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro", "controller-auth:/run/controller-auth:ro", "guard-auth:/run/guard-auth:ro"]
    networks: [docker-control, control-data, docker-traffic]
    depends_on:
      docker-proxy: {condition: service_healthy}
  backend-a:
    <<: *backend
    environment:
      BACKEND_ID: backend-a
      LOGICAL_ADMISSION_MEM_MB: "1024"
      MAX_INFLIGHT: "4"
      TMPDIR: /run/mslb-tmp
  backend-b:
    <<: *backend
    environment:
      BACKEND_ID: backend-b
      LOGICAL_ADMISSION_MEM_MB: "1024"
      MAX_INFLIGHT: "4"
      TMPDIR: /run/mslb-tmp

networks:
  docker-traffic:
    internal: true
  docker-control:
    internal: true
  control-data:
    internal: true

volumes:
  controller-auth:
  guard-auth:
  host-memory:
