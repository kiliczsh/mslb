name: mslb

include:
  - path: compose.docker-simulation.yaml

x-tool: &tool
  profiles: [tools]
  read_only: true
  tmpfs: [/tmp:size=128m]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  cpus: 1
  mem_limit: 1024m
  memswap_limit: 1024m

services:
  postgres:
    image: mslb-postgres:local
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    pull_policy: build
    environment:
      POSTGRES_USER: mslb
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: mslb
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8 --auth-local=scram-sha-256 --auth-host=scram-sha-256
    command: [postgres, -c, shared_buffers=128MB, -c, work_mem=2MB, -c, max_connections=20, -c, max_parallel_workers_per_gather=0]
    volumes: [postgres-data:/var/lib/postgresql/data]
    shm_size: 128m
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, 'PGCONNECT_TIMEOUT=2 PGPASSWORD="$$POSTGRES_PASSWORD" psql --host=127.0.0.1 --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB" --no-password --tuples-only --command="SELECT 1" > /dev/null']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal, control-data]
  redis:
    image: redis:7.4.11-alpine@sha256:d9436322172a5b482c187bf1f363d3c4fea086fcca6b9c8a94de8f0f39ed3193
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru, --maxclients, "64", --client-output-buffer-limit, "normal 8mb 2mb 10", --client-output-buffer-limit, "pubsub 4mb 1mb 10", --save, "", --appendonly, "no"]
    read_only: true
    tmpfs: [/data:size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: redis
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]
  python-checks:
    <<: *tool
    image: mslb-python-tools:local
    build:
      context: .
      dockerfile: infra/tooling/python.Dockerfile
      target: checks
    network_mode: none
  frontend-checks:
    <<: *tool
    image: mslb-frontend-tools:local
    build:
      context: .
      dockerfile: infra/tooling/frontend.Dockerfile
    network_mode: none
    tmpfs: [/tmp:size=128m, /home/node/.cache:size=32m, "/app/.test-output:size=64m,uid=1000,gid=1000"]
  runtime-check:
    <<: *tool
    image: mslb-python-runtime:local
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 32
    network_mode: none
    command:
      - python
      - -c
      - |
        import importlib.util, os, shutil
        from pathlib import Path
        import mslb_api.app, mslb_application.worker, mslb_controller.engine, mslb_mock_server.app
        assert importlib.util.find_spec(name="pytest") is None
        assert all(shutil.which(cmd=name) is None for name in ("uv", "just", "ruff", "ty", "node", "pyright"))
        assert not Path("/opt/mslb-pyright").exists()
        assert not Path("/app/tests").exists()
        assert Path("/app/scripts/validate_run.py").read_bytes() == Path("/fixtures/core/validate_run.py").read_bytes()
        assert os.getuid() == 1000
        print("Runtime imports, validator identity, non-root user and tool isolation verified")
  web:
    <<: *tool
    profiles: []
    image: mslb-web:local
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    mem_limit: 128m
    memswap_limit: 128m
    ports: ["127.0.0.1:8080:8080"]
    networks: [internal, ingress]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 3s
      retries: 20
  browser-checks:
    <<: *tool
    image: mslb-browser-tools:local
    build:
      context: .
      dockerfile: infra/tooling/browser.Dockerfile
    environment:
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    tmpfs: [/tmp:size=256m, "/app/test-results:size=64m,uid=1000,gid=1000"]
    shm_size: 128m
    pids_limit: 256
    networks: [internal]
    depends_on:
      web: {condition: service_healthy}
      worker: {condition: service_healthy}
  dependencies-check:
    <<: *tool
    image: mslb-python-tools:local
    command: [python, scripts/check_dependencies.py]
    environment:
      DATABASE_URL: postgresql://mslb:local-demo-only@postgres/mslb
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]
  traffic-check:
    <<: *tool
    image: mslb-python-tools:local
    command: [python, scripts/check_traffic.py]
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      backend-a: {condition: service_healthy}
      backend-b: {condition: service_healthy}
    networks: [docker-traffic]
  bundle-runner:
    <<: *tool
    image: mslb-python-tools:local
    entrypoint: [python, scripts/run_bundle.py]
    command: [run, --servers, /fixtures/core/servers.json, --requests, /app/data/examples/scaling-requests.csv, --config, /app/data/examples/scaling-config.json, --output, /data/exports/scaled-example]
    volumes: [exports:/data/exports]
    network_mode: none
  persistence-checks:
    <<: *tool
    image: mslb-python-tools:local
    command: [pytest, tests/integration]
    environment:
      TEST_DATABASE_URL: postgresql://mslb:local-demo-only@postgres/mslb
      TEST_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]
  migrate:
    <<: *tool
    profiles: []
    image: mslb-python-runtime:local
    command: [python, -m, mslb_persistence.migrations]
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      DATABASE_URL: postgresql://mslb:local-demo-only@postgres/mslb
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
  worker-check:
    <<: *tool
    image: mslb-python-tools:local
    command: [python, scripts/check_worker.py]
    environment:
      DATABASE_URL: postgresql://mslb:local-demo-only@postgres/mslb
    volumes: [inputs:/data/inputs, outputs:/data/outputs:ro]
    depends_on:
      worker: {condition: service_healthy}
    networks: [internal]
  worker:
    <<: *tool
    profiles: []
    image: mslb-python-runtime:local
    build:
      context: .
      dockerfile: infra/tooling/python.Dockerfile
      target: runtime
    command: [python, -m, mslb_worker]
    environment:
      RESOURCE_GUARD_ENABLED: "true"
      DATABASE_URL: postgresql://mslb:local-demo-only@postgres/mslb
      REDIS_URL: redis://redis:6379/0
      INPUT_ROOT: /data/inputs
      OUTPUT_ROOT: /data/outputs
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    volumes: [inputs:/data/inputs:ro, outputs:/data/outputs]
    networks: [internal]
    restart: on-failure:3
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -m, mslb_worker.health]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
        mode: non-blocking
        max-buffer-size: 1m
  api:
    <<: *tool
    profiles: []
    image: mslb-python-runtime:local
    build:
      context: .
      dockerfile: infra/tooling/python.Dockerfile
      target: runtime
    command: [python, -m, mslb_api]
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      RESOURCE_GUARD_ENABLED: "true"
      DATABASE_URL: postgresql://mslb:local-demo-only@postgres/mslb
      INPUT_ROOT: /data/inputs
      OUTPUT_ROOT: /data/outputs
      API_STATE_ROOT: /data/api-state
      API_BIND_HOST: 0.0.0.0
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost:8000,127.0.0.1:8000,api:8000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:8080,http://127.0.0.1:8080,http://web:8080}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    volumes: [inputs:/data/inputs, outputs:/data/outputs:ro, api-state:/data/api-state]
    networks: [internal, ingress]
    restart: on-failure:3
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
        mode: non-blocking
        max-buffer-size: 1m
  api-check:
    <<: *tool
    image: mslb-python-tools:local
    command: [python, scripts/check_api.py]
    environment:
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_healthy}
    networks: [internal]
  docker-public-check:
    <<: *tool
    image: mslb-python-tools:local
    command: [python, scripts/check_docker_api.py]
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 48
    environment:
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    depends_on:
      api: {condition: service_healthy}
      container-controller: {condition: service_healthy}
      resource-guard: {condition: service_healthy}
    networks: [internal]
  mcp-check:
    <<: *tool
    image: mslb-python-tools:local
    command: [python, scripts/check_mcp.py]
    environment:
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_healthy}
    networks: [internal]

networks:
  ingress:
    driver: bridge
  internal:
    internal: true

volumes:
  postgres-data:
  exports:
  inputs:
  outputs:
  api-state:
