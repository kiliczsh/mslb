[project]
name = "mslb-worker"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["mslb-application", "mslb-persistence", "redis==8.1.0"]

[tool.uv.sources]
mslb-application = { workspace = true }
mslb-persistence = { workspace = true }

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mslb_worker"]
